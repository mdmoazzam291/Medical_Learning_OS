name: Supabase R2 restore drill

on:
  pull_request:
    paths:
      - '.github/workflows/supabase-r2-restore-drill.yml'
      - 'supabase/migrations/20261028223000_admin_syllabus_baseline_drafts.sql'
      - 'supabase/migrations/20261029000100_admin_syllabus_review_preflight.sql'
      - 'supabase/migrations/20261029012000_syllabus_independent_scope_review.sql'
      - 'ops/r2-backups/verify_restore.py'
      - 'ops/r2-backups/test_verify_restore.py'
      - '.github/workflows/supabase-r2-backup.yml'
      - 'supabase/verification/export-access.sql'
      - 'scripts/access-manifest-db-check.js'
      - 'ops/r2-backups/vault_recovery.py'
      - 'ops/r2-backups/test_vault_recovery.py'
      - 'ops/r2-backups/test_restore_archive.py'
      - 'ops/r2-backups/check_vault_recovery.py'
      - 'ops/r2-backups/install_age.sh'
  workflow_dispatch:
  schedule:
    # Monthly full recoverability proof. Weekly backups remain separate.
    # 06:00 IST on the first day of each month.
    - cron: '30 0 1 * *'
permissions:
  contents: read

concurrency:
  group: supabase-r2-restore-drill
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    uses: ./.github/workflows/supabase-r2-backup.yml
    secrets:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  restore:
    needs: snapshot
    # Secrets are available only to owner-authored same-repository validation.
    if: always() && (github.event_name != 'pull_request' || (needs.snapshot.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test private restore verifier
        run: python3 -m unittest discover -s ops/r2-backups -p 'test_*.py' -v
      - name: Install pinned encryption tool and test private recovery
        run: |
          bash ops/r2-backups/install_age.sh
          AGE_BIN="$RUNNER_TEMP/mlos-age/age" python3 -m unittest discover -s ops/r2-backups -p test_vault_recovery.py -v
      - name: Discover and download latest backup from R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2 access key}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2 secret key}"
          : "${R2_BUCKET:?Missing R2 bucket}"
          : "${R2_ENDPOINT:?Missing R2 endpoint}"
          case "$R2_ENDPOINT" in
            https://*.r2.cloudflarestorage.com) ;;
            *) echo "R2_ENDPOINT must be the Cloudflare R2 S3 endpoint."; exit 1 ;;
          esac
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check awscli
          fi

          root="$RUNNER_TEMP/mlos-restore"
          mkdir -p "$root"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "supabase/" \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > "$root/inventory.json"

          prefix="$(python3 - "$root/inventory.json" <<'PY'
          import json
          import re
          import sys

          objects = json.load(open(sys.argv[1], encoding='utf-8')).get('Contents') or []
          pattern = re.compile(r'^supabase/\d{4}/\d{2}/\d{2}/\d{8}T\d{6}Z/backup\.tar\.gz$')
          candidates = [
              item for item in objects
              if pattern.fullmatch(str(item.get('Key') or '')) and str(item.get('Key') or '').split('/')[-2] > '20261003T231839Z'
          ]
          if not candidates:
              raise SystemExit('No post-reset canonical Supabase backup archive found in R2')
          latest = max(candidates, key=lambda item: str(item.get('LastModified') or ''))
          print(latest['Key'][:-len('/backup.tar.gz')])
          PY
          )"

          echo "Selected latest backup prefix: $prefix"
          echo "MLOS_BACKUP_PREFIX=$prefix" >> "$GITHUB_ENV"

          aws s3 cp "s3://$R2_BUCKET/$prefix/backup.tar.gz" \
            "$root/backup.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$prefix/backup.tar.gz.sha256" \
            "$root/backup.tar.gz.sha256" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Verify freshness, archive, checksums and source project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil
          import tarfile

          root = Path(os.environ['RUNNER_TEMP']) / 'mlos-restore'
          archive = root / 'backup.tar.gz'
          checksum = (root / 'backup.tar.gz.sha256').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{64}  \S+', checksum), 'Invalid archive checksum format'
          expected = checksum.split()[0]
          digest = hashlib.sha256()
          with archive.open('rb') as source:
              for block in iter(lambda: source.read(1024 * 1024), b''):
                  digest.update(block)
          assert digest.hexdigest() == expected, 'R2 archive checksum mismatch'

          names = {'roles.sql', 'schema.sql', 'data.sql', 'access.sql', 'SHA256SUMS', 'manifest.json'}
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              if any(member.name == 'vault.json.age' for member in members):
                  names.add('vault.json.age')
              assert len(members) == len(names), 'Unexpected archive member count'
              assert {member.name for member in members} == names, 'Unexpected archive paths'
              assert all(member.isfile() and member.size <= 100_000_000 for member in members), 'Unsafe archive member'
              for member in members:
                  with tar.extractfile(member) as source, (root / member.name).open('wb') as target:
                      shutil.copyfileobj(source, target)

          manifest = json.loads((root / 'manifest.json').read_text())
          has_vault = 'vault.json.age' in names
          required_format = 'supabase-cli-sql-vault-v3' if has_vault else 'supabase-cli-sql-access-v2'
          assert manifest['format'] == required_format, 'Backup format and members disagree'
          assert manifest['project_ref'] == 'iyapppmeieqhflnzslao', 'Wrong source project'
          assert manifest['repository'] == 'mdmoazzam291/Medical_Learning_OS', 'Wrong source repository'
          assert str(manifest['workflow_run_id']).isdigit(), 'Invalid backup workflow run id'
          assert str(manifest['workflow_run_attempt']).isdigit(), 'Invalid backup workflow attempt'

          created = datetime.fromisoformat(str(manifest['created_at_utc']).replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - created
          assert age >= timedelta(0), 'Backup timestamp is in the future'
          assert age <= timedelta(days=9), f'Latest backup is stale: age={age}'

          prefix = os.environ.get('MLOS_BACKUP_PREFIX', '')
          assert re.fullmatch(r'supabase/\d{4}/\d{2}/\d{2}/\d{8}T\d{6}Z', prefix), 'Invalid selected prefix'
          timestamp = prefix.rsplit('/', 1)[-1]
          prefix_started = datetime.strptime(timestamp, '%Y%m%dT%H%M%SZ').replace(tzinfo=timezone.utc)
          manifest_delay = created - prefix_started
          assert manifest_delay >= timedelta(0), 'Manifest predates backup prefix timestamp'
          assert manifest_delay <= timedelta(minutes=30), (
              f'Backup prefix/manifest timing drift too large: {manifest_delay}'
          )

          lines = (root / 'SHA256SUMS').read_text().splitlines()
          required_files = {'roles.sql', 'schema.sql', 'data.sql', 'access.sql'}
          if has_vault:
              required_files.add('vault.json.age')
          assert len(lines) == len(required_files), 'Unexpected inner checksum count'
          actual_names = set()
          for line in lines:
              match = re.fullmatch(r'([0-9a-f]{64})  (roles\.sql|schema\.sql|data\.sql|access\.sql|vault\.json\.age)', line)
              assert match, 'Invalid inner checksum entry'
              file_digest, filename = match.groups()
              actual_names.add(filename)
              assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == file_digest, 'SQL checksum mismatch'
          assert actual_names == required_files, 'Missing or extra backup checksum'
          print(
              'Latest backup verified: '
              f"prefix={prefix} run={manifest['workflow_run_id']} "
              f"attempt={manifest['workflow_run_attempt']} age={age}"
          )
          PY

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.121.0

      - name: Restore only into disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          mkdir -p "$RUNNER_TEMP/mlos-local-restore"
          cd "$RUNNER_TEMP/mlos-local-restore"
          supabase init --yes >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase db start > "$RUNNER_TEMP/restore-platform.log" 2>&1
          local_url=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null

          container=supabase_db_mlos-local-restore
          # Pull/start happens before isolation. All restore SQL runs afterward.
          networks="$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$container")"
          for network in $networks; do docker network disconnect "$network" "$container"; done
          test "$(docker inspect --format '{{len .NetworkSettings.Networks}}' "$container")" = 0
          docker exec "$container" psql -U supabase_admin -d postgres -X -q -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET cron.launch_active_jobs = off" \
            -c "SELECT pg_reload_conf()" > /dev/null
          sleep 2
          cron_state="$(docker exec "$container" psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "SHOW cron.launch_active_jobs")"
          test "$cron_state" = off
          docker exec "$container" psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 \
            -c "SELECT encode(extensions.digest('abc','sha256'),'hex') = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'" | grep -qx t
          cd "$GITHUB_WORKSPACE"
          python3 ops/r2-backups/check_vault_recovery.py
          docker cp "$RUNNER_TEMP/mlos-restore" "$container:/tmp/mlos-restore"
          if ! docker exec "$container" psql --username supabase_admin --no-psqlrc --single-transaction --variable ON_ERROR_STOP=1 \
            --variable VERBOSITY=sqlstate --quiet --file "/tmp/mlos-restore/roles.sql" \
            --file "/tmp/mlos-restore/schema.sql" \
            --command 'SET session_replication_role = replica' \
            --file "/tmp/mlos-restore/data.sql" \
            --file "/tmp/mlos-restore/access.sql" \
            --dbname postgres > "$RUNNER_TEMP/restore.out" 2> "$RUNNER_TEMP/restore.err"; then
            python3 - <<'PYERR'
          import os, re
          from pathlib import Path
          for line in (Path(os.environ['RUNNER_TEMP']) / 'restore.err').read_text().splitlines():
              match = re.search(r'(roles|schema|data|access)\.sql:(\d+): ERROR:  ([A-Z0-9]{5})', line)
              if match:
                  name, number, code = match.groups()
                  print(f'Restore SQLSTATE={code} file={name}.sql line={number}')
          PYERR
            echo 'Local restore failed. No live database was modified.'
            exit 1
          fi

      - name: Verify restored access, data and encrypted Vault configuration
        shell: bash
        env:
          MLOS_RECOVERY_AGE_IDENTITY: ${{ secrets.MLOS_RECOVERY_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          container=supabase_db_mlos-local-restore
          docker exec -i "$container" psql -U supabase_admin -d postgres -X -q -v ON_ERROR_STOP=1 \
            < supabase/verification/data-api-grants.sql
          docker exec -i "$container" psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 \
            < supabase/verification/export-access.sql > "$RUNNER_TEMP/mlos-restore/access.restored.sql"
          if ! cmp --silent "$RUNNER_TEMP/mlos-restore/access.sql" "$RUNNER_TEMP/mlos-restore/access.restored.sql"; then
            echo 'Restored access metadata differs from the source snapshot.'
            exit 1
          fi
          echo 'Exact source public owners, grants, column privileges and defaults matched.'
          python3 ops/r2-backups/verify_restore.py \
            "$RUNNER_TEMP/mlos-restore/data.sql" supabase/migrations "$container"

      - name: Remove disposable database and downloaded backup
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/mlos-local-restore/supabase/config.toml" ]; then
            cd "$RUNNER_TEMP/mlos-local-restore"
            supabase stop --no-backup || true
          fi
          rm -rf "$RUNNER_TEMP/mlos-restore"
          rm -f "$RUNNER_TEMP/restore.out" "$RUNNER_TEMP/restore.err" "$RUNNER_TEMP/restore-platform.log"
