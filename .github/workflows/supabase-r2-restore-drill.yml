name: Supabase R2 restore drill

on:
  workflow_dispatch:
  schedule:
    # Monthly full recoverability proof. Weekly backups remain separate.
    # 06:00 IST on the first day of each month.
    - cron: '30 0 1 * *'
  push:
    branches: ["ops/m14-latest-backup-restore"]

permissions:
  contents: read

concurrency:
  group: supabase-r2-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Discover and download latest backup from R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Missing R2 access key}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing R2 secret key}"
          : "${R2_BUCKET:?Missing R2 bucket}"
          : "${R2_ENDPOINT:?Missing R2 endpoint}"
          case "$R2_ENDPOINT" in
            https://*.r2.cloudflarestorage.com) ;;
            *) echo "R2_ENDPOINT must be the Cloudflare R2 S3 endpoint."; exit 1 ;;
          esac
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check awscli
          fi

          root="$RUNNER_TEMP/mlos-restore"
          mkdir -p "$root"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "supabase/" \
            --endpoint-url "$R2_ENDPOINT" \
            --output json > "$root/inventory.json"

          prefix="$(python3 - "$root/inventory.json" <<'PY'
          import json
          import re
          import sys

          objects = json.load(open(sys.argv[1], encoding='utf-8')).get('Contents') or []
          pattern = re.compile(r'^supabase/\d{4}/\d{2}/\d{2}/\d{8}T\d{6}Z/backup\.tar\.gz$')
          candidates = [
              item for item in objects
              if pattern.fullmatch(str(item.get('Key') or ''))
          ]
          if not candidates:
              raise SystemExit('No canonical Supabase backup archive found in R2')
          latest = max(candidates, key=lambda item: str(item.get('LastModified') or ''))
          print(latest['Key'][:-len('/backup.tar.gz')])
          PY
          )"

          echo "Selected latest backup prefix: $prefix"
          echo "MLOS_BACKUP_PREFIX=$prefix" >> "$GITHUB_ENV"

          aws s3 cp "s3://$R2_BUCKET/$prefix/backup.tar.gz" \
            "$root/backup.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/$prefix/backup.tar.gz.sha256" \
            "$root/backup.tar.gz.sha256" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Verify freshness, archive, checksums and source project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil
          import tarfile

          root = Path(os.environ['RUNNER_TEMP']) / 'mlos-restore'
          archive = root / 'backup.tar.gz'
          checksum = (root / 'backup.tar.gz.sha256').read_text().strip()
          assert re.fullmatch(r'[0-9a-f]{64}  \S+', checksum), 'Invalid archive checksum format'
          expected = checksum.split()[0]
          digest = hashlib.sha256()
          with archive.open('rb') as source:
              for block in iter(lambda: source.read(1024 * 1024), b''):
                  digest.update(block)
          assert digest.hexdigest() == expected, 'R2 archive checksum mismatch'

          names = {'roles.sql', 'schema.sql', 'data.sql', 'SHA256SUMS', 'manifest.json'}
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              assert len(members) == len(names), 'Unexpected archive member count'
              assert {member.name for member in members} == names, 'Unexpected archive paths'
              assert all(member.isfile() and member.size <= 100_000_000 for member in members), 'Unsafe archive member'
              for member in members:
                  with tar.extractfile(member) as source, (root / member.name).open('wb') as target:
                      shutil.copyfileobj(source, target)

          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['project_ref'] == 'iyapppmeieqhflnzslao', 'Wrong source project'
          assert manifest['repository'] == 'mdmoazzam291/Medical_Learning_OS', 'Wrong source repository'
          assert str(manifest['workflow_run_id']).isdigit(), 'Invalid backup workflow run id'
          assert str(manifest['workflow_run_attempt']).isdigit(), 'Invalid backup workflow attempt'

          created = datetime.fromisoformat(str(manifest['created_at_utc']).replace('Z', '+00:00'))
          age = datetime.now(timezone.utc) - created
          assert age >= timedelta(0), 'Backup timestamp is in the future'
          assert age <= timedelta(days=9), f'Latest backup is stale: age={age}'

          prefix = os.environ.get('MLOS_BACKUP_PREFIX', '')
          assert re.fullmatch(r'supabase/\d{4}/\d{2}/\d{2}/\d{8}T\d{6}Z', prefix), 'Invalid selected prefix'
          timestamp = prefix.rsplit('/', 1)[-1]
          manifest_timestamp = created.strftime('%Y%m%dT%H%M%SZ')
          assert timestamp == manifest_timestamp, 'Backup prefix/manifest timestamp mismatch'

          lines = (root / 'SHA256SUMS').read_text().splitlines()
          assert len(lines) == 3, 'Unexpected inner checksum count'
          actual_names = set()
          for line in lines:
              match = re.fullmatch(r'([0-9a-f]{64})  (roles\.sql|schema\.sql|data\.sql)', line)
              assert match, 'Invalid inner checksum entry'
              file_digest, filename = match.groups()
              actual_names.add(filename)
              assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == file_digest, 'SQL checksum mismatch'
          assert actual_names == {'roles.sql', 'schema.sql', 'data.sql'}, 'Missing SQL dump'
          print(
              'Latest backup verified: '
              f"prefix={prefix} run={manifest['workflow_run_id']} "
              f"attempt={manifest['workflow_run_attempt']} age={age}"
          )
          PY

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Restore only into disposable local Supabase database
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          mkdir -p "$RUNNER_TEMP/mlos-local-restore"
          cd "$RUNNER_TEMP/mlos-local-restore"
          supabase init --yes >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase db start >/dev/null
          local_url=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null

          container=supabase_db_mlos-local-restore
          docker cp "$RUNNER_TEMP/mlos-restore" "$container:/tmp/mlos-restore"
          if ! docker exec "$container" psql --username supabase_admin --no-psqlrc --single-transaction --variable ON_ERROR_STOP=1 \
            --variable VERBOSITY=sqlstate --quiet --file "/tmp/mlos-restore/roles.sql" \
            --file "/tmp/mlos-restore/schema.sql" \
            --command 'SET session_replication_role = replica' \
            --file "/tmp/mlos-restore/data.sql" \
            --dbname postgres > "$RUNNER_TEMP/restore.out" 2> "$RUNNER_TEMP/restore.err"; then
            python3 - <<'PYERR'
          import os, re
          from pathlib import Path
          for line in (Path(os.environ['RUNNER_TEMP']) / 'restore.err').read_text().splitlines():
              match = re.search(r'(roles|schema|data)\.sql:(\d+): ERROR:  ([A-Z0-9]{5})', line)
              if match:
                  name, number, code = match.groups()
                  print(f'Restore SQLSTATE={code} file={name}.sql line={number}')
          PYERR
            echo 'Local restore failed. No live database was modified.'
            exit 1
          fi

          tables="$(psql --no-psqlrc --tuples-only --no-align --variable ON_ERROR_STOP=1 \
            --dbname "$local_url" --command "SELECT count(*) FROM pg_class WHERE oid IN (
              'public.study_catalog'::regclass, 'public.study_sessions'::regclass,
              'public.study_attempts'::regclass, 'public.study_bookmarks'::regclass
            ) AND relrowsecurity")"
          test "$tables" = 4

          python3 - <<'PYCHECK'
          import os, re, subprocess
          from pathlib import Path

          tables = {'study_catalog', 'study_sessions', 'study_attempts', 'study_bookmarks'}
          verified = set()
          lines = iter((Path(os.environ['RUNNER_TEMP']) / 'mlos-restore/data.sql').read_text().splitlines())
          for line in lines:
              match = re.fullmatch(r'COPY "?public"?\."?([a-z_]+)"? \(([a-z_, "\s]+)\) FROM stdin;', line)
              if not match or match[1] not in tables:
                  continue
              name, columns = match.groups()
              expected = []
              for row in lines:
                  if row == r'\.':
                      break
                  expected.append(row)
              result = subprocess.run([
                  'docker', 'exec', 'supabase_db_mlos-local-restore',
                  'psql', '-U', 'supabase_admin', '-d', 'postgres', '--no-psqlrc',
                  '--variable', 'ON_ERROR_STOP=1', '--command',
                  f'COPY public."{name}" ({columns}) TO STDOUT'
              ], capture_output=True, text=True)
              assert result.returncode == 0, 'Restored table read failed'
              assert sorted(result.stdout.splitlines()) == sorted(expected), 'Restored table data mismatch'
              verified.add(name)
          assert verified == tables, 'Missing study table COPY data in backup'
          print('Latest-backup restore passed: four RLS-enabled study tables match backup data exactly.')
          PYCHECK

      - name: Remove disposable database and downloaded backup
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/mlos-local-restore/supabase/config.toml" ]; then
            cd "$RUNNER_TEMP/mlos-local-restore"
            supabase stop --no-backup || true
          fi
          rm -rf "$RUNNER_TEMP/mlos-restore"
          rm -f "$RUNNER_TEMP/restore.out" "$RUNNER_TEMP/restore.err"
