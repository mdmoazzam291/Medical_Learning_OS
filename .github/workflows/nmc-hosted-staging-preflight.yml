name: NMC hosted staging preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the staging connection and inspect schema readiness
        env:
          STAGING_DB_URL: ${{ secrets.MLOS_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          try:
              url = urlsplit(os.environ["STAGING_DB_URL"])
              valid = (
                  url.scheme in {"postgres", "postgresql"}
                  and url.username == "postgres.vwtdwafjrraptrgeshzt"
                  and url.hostname is not None
                  and url.hostname.endswith(".pooler.supabase.com")
                  and url.port == 5432
                  and url.path == "/postgres"
                  and bool(url.password)
                  and not url.query
                  and not url.fragment
              )
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit("Expected the designated staging Session pooler URI.")
          PY

