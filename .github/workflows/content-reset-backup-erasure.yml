name: Authorized old-content backup erasure
on:
  push:
    branches: [main]
    paths: ['ops/content-reset/purge_backups.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-r2-backup
  cancel-in-progress: false
jobs:
  erase-old-backups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ops/content-reset -p 'test_*.py' -v
      - name: Erase only old Medical OS backup copies
        env:
          CONTENT_RESET_ID: permanent-2026-10-04
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          python3 -m pip install --disable-pip-version-check awscli
          python3 ops/content-reset/purge_backups.py
