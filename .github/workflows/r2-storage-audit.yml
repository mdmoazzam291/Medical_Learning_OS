name: R2 storage and retention audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r2-storage-audit.yml'
      - 'ops/r2-backups/storage_guard.py'
      - 'ops/r2-backups/test_storage_guard.py'
  schedule:
    # Monthly read-only inventory; the monitor requires evidence within 35 days.
    # 07:45 IST on the first day of each month, after the restore drill.
    - cron: '15 2 1 * *'

permissions:
  contents: read

concurrency:
  group: supabase-r2-backup
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test storage and retention controls
        run: python3 -m unittest discover -s ops/r2-backups -p 'test_storage_guard.py' -v
      - name: Inventory private backup bucket without mutations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check awscli
          fi
          python3 ops/r2-backups/storage_guard.py
