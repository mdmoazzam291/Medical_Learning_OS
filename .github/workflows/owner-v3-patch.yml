name: Owner Operations V3 source patch

on:
  push:
    branches:
      - feat/owner-operations-v3
    paths:
      - scripts/patch-owner-v3.mjs
      - .github/workflows/owner-v3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-operations-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic V3 patches
        run: node scripts/patch-owner-v3.mjs
      - name: Verify patch cleanliness
        run: git diff --check
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/study-api/index.ts \
                  supabase/functions/review-api/index.ts \
                  supabase/functions/retention-probe-api/index.ts \
                  supabase/functions/owner-api/index.ts \
                  src/adapters/cloud-owner.js \
                  web/owner-console.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Owner Operations V3 API gates"
          git push origin HEAD:feat/owner-operations-v3
