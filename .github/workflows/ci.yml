name: Foundation checks
# Validate PRs once; validate main again after merge. Feature-branch pushes
# are covered by pull_request, avoiding a duplicate pair of runner jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build:pages
      - name: Verify Pages bundle tests
        run: node --test tests/cloudflare-pages-build.test.js
      - name: Verify account landing public-surface tests
        run: node --test tests/account-landing-ui.test.js
      - name: Verify beta public-surface tests
        run: node --test tests/beta-ui-architecture.test.js
      - name: Verify OAuth public-surface tests
        run: node --test tests/oauth-consent-ui.test.js
      - name: Verify Sentry hosting tests
        run: node --test tests/sentry-wiring.test.js
      - name: Diagnose Node tests A-D
        continue-on-error: true
        run: node --test tests/[a-d]*.test.js
      - name: Diagnose Node tests E-H
        continue-on-error: true
        run: node --test tests/[e-h]*.test.js
      - name: Diagnose Node tests I-L
        continue-on-error: true
        run: node --test tests/[i-l]*.test.js
      - name: Diagnose Node tests M-P
        continue-on-error: true
        run: node --test tests/[m-p]*.test.js
      - name: Diagnose Node tests Q-T
        continue-on-error: true
        run: node --test tests/[q-t]*.test.js
      - name: Diagnose Node tests U-Z
        continue-on-error: true
        run: node --test tests/[u-z]*.test.js
      - name: Verify full Node suite serially
        run: node --test --test-concurrency=1
      - run: npm test
      - run: npm run demo
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mlos-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/mlos-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify responsive study flows and storage
        run: |
          npm start > "$RUNNER_TEMP/mlos-server.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/mlos-screenshots"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/browser-check.js
      - name: Verify feedback and saved-session Vault return
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/feedback-browser-check.js
      - name: Verify Study entry and saved-session reload
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/study-entry-browser-check.js
      - name: Verify integrated learner UX journey and recovery
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/ux-journey-browser-check.js
      - name: Verify learner-private correction overlay
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/correction-browser-check.js
      - name: Verify responsive Vault and personal note persistence
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/vault-browser-check.js
      - name: Verify unsaved Vault drafts and conflict recovery
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/vault-drafts-browser-check.js
      - name: Verify learner report reviewer triage
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/learner-report-triage-browser-check.js
      - name: Verify Exam Mode responsive interactions
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/exam-browser-check.js
      - name: Verify optional retention delivery interactions
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/retention-browser-check.js
      - name: Verify learner-controlled retention origin handoff
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/retention-origin-browser-check.js
      - name: Verify claim-first References workspace
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/references-browser-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-preview
          path: ${{ runner.temp }}/mlos-screenshots
          if-no-files-found: ignore
