name: Foundation checks
# Validate PRs once; validate main again after merge. Feature-branch pushes
# are covered by pull_request, avoiding a duplicate pair of runner jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build:pages
      - run: npm test
      - run: python3 -m unittest discover -s ops/content-reset -p 'test_*.py' -v
      - name: Verify question intelligence against isolated PostgreSQL
        run: |
          npm install --prefix "$RUNNER_TEMP/mlos-pg" --no-audit --no-fund @electric-sql/pglite@0.3.14
          PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/question-intelligence-db-check.js
      - name: Verify private coherent coverage snapshots
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/content-coverage-db-check.js
      - name: Self-test non-writing hosted concept-draft access harness
        run: node scripts/live-concept-drafts-http-check.mjs --self-test
      - name: Verify non-writing syllabus draft negative and CORS access on deployed API
        run: |
          node tests/hosted-syllabus-baseline-negative.mjs --self-test
          node tests/hosted-syllabus-baseline-negative.mjs --hosted
      - name: Verify immutable concept draft persistence
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/concept-drafts-db-check.js
      - name: Verify immutable private syllabus checklist proposals
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/syllabus-baseline-db-check.js
      - name: Verify protected medical relationship registry against isolated PostgreSQL
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/medical-relationship-db-check.js
      - name: Verify exact access manifest against unsafe restore defaults
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/access-manifest-db-check.js
      - name: Verify recovered historical baseline and learner isolation
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/baseline-migrations-db-check.js
      - name: Verify privacy scope and erasure against isolated PostgreSQL
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/privacy-scope-db-check.js
      - name: Verify explicit Data API grants without automatic defaults
        run: PGLITE_MODULE_URL="file://$RUNNER_TEMP/mlos-pg/node_modules/@electric-sql/pglite/dist/index.js" node scripts/data-api-grants-db-check.js
      - run: npm run demo
      - name: Preserve allowlisted static preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: learner-static-preview
          path: dist-pages/
          if-no-files-found: error
          retention-days: 7
  webkit:
    # Native macOS WebKit provides composited screenshots closest to Safari.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated WebKit verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mlos-webkit" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/mlos-webkit/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Verify synthetic syllabus Admin/learner acceptance UI in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node tests/syllabus-acceptance-browser-check.js
      - name: Verify concept draft editor in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/concept-drafts-browser-check.js
      - name: Verify Admin coverage inventory in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/content-coverage-browser-check.js
      - name: Verify protected relationship review in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/medical-relationship-browser-check.js
      - name: Verify unified content workspace in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/content-workspace-browser-check.js
      - name: Verify preparation focus on WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/preparation-browser-check.js
      - name: Verify iPad portrait, landscape and split-screen navigation with touch
        run: |
          mkdir -p "$RUNNER_TEMP/mlos-webkit-screenshots"
          NAVIGATION_HEADED=1 DEBUG=pw:browser BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-webkit-screenshots" node scripts/navigation-browser-check.js
      - name: Verify adaptive brand palettes in WebKit
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/brand-browser-check.js
      - name: Public guest navigation and preserved sign-in
        run: BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/public-navigation-browser-check.js
      - name: Verify Reference Review entry and authorized gate selection in WebKit
        run: |
          npm start > "$RUNNER_TEMP/mlos-server.log" 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          DEBUG=pw:browser BROWSER_ENGINE=webkit PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-webkit/node_modules/playwright/index.mjs" node scripts/references-browser-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-ipad-preview
          path: ${{ runner.temp }}/mlos-webkit-screenshots
          if-no-files-found: ignore
          retention-days: 7
  browser:
    # Playwright 1.56.1 does not support the Ubuntu 26.04 image used by ubuntu-latest.
    # Pin to a supported LTS runner until the browser verification stack is upgraded.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mlos-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/mlos-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify synthetic syllabus Admin/learner acceptance UI in Chromium
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node tests/syllabus-acceptance-browser-check.js
      - name: Verify concept draft editor in Chromium
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/concept-drafts-browser-check.js
      - name: Verify Admin coverage inventory in Chromium
        run: SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/content-coverage-browser-check.js
      - name: Verify protected relationship review in Chromium
        run: SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/medical-relationship-browser-check.js
      - name: Verify responsive study flows and storage
        run: |
          npm start > "$RUNNER_TEMP/mlos-server.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/mlos-screenshots"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/browser-check.js
      - name: Verify signed-out sections and safe authentication return
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/guest-access-browser-check.js
      - name: Verify adaptive brand palettes and contrast
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/brand-browser-check.js
      - name: Public guest navigation and preserved sign-in
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/public-navigation-browser-check.js
      - name: Verify public homepage and new-learner entry
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/public-home-browser-check.js
      - name: Verify public policies without login or JavaScript
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/public-policies-browser-check.js
      - name: Verify login landing and auth failure recovery
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/auth-recovery-browser-check.js
      - name: Verify feedback and saved-session Vault return
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/feedback-browser-check.js
      - name: Verify Study entry and saved-session reload
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/study-entry-browser-check.js
      - name: Verify confidence capture in built static bundle
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/confidence-browser-check.js
      - name: Verify preparation goals, scope and persistence
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/preparation-browser-check.js
      - name: Verify unified concept workspace and isolated draft previews
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/content-workspace-browser-check.js
      - name: Verify shared navigation and all published workspaces
        run: xvfb-run -a env NAVIGATION_HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/navigation-browser-check.js
      - name: Verify connected Notes/Graph and one-action admin import
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/library-browser-check.js
      - name: Verify integrated learner UX journey and recovery
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/ux-journey-browser-check.js
      - name: Verify learner-private correction overlay
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/correction-browser-check.js
      - name: Verify responsive Vault and personal note persistence
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/vault-browser-check.js
      - name: Verify unsaved Vault drafts and conflict recovery
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/vault-drafts-browser-check.js
      - name: Verify learner report reviewer triage
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/learner-report-triage-browser-check.js
      - name: Verify Exam Mode responsive interactions
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" SCREENSHOT_DIR="$RUNNER_TEMP/mlos-screenshots" node scripts/exam-browser-check.js
      - name: Verify optional retention delivery interactions
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/retention-browser-check.js
      - name: Verify learner-controlled retention origin handoff
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/retention-origin-browser-check.js
      - name: Verify claim-first References workspace
        run: PLAYWRIGHT_MODULE_URL="file://$RUNNER_TEMP/mlos-browser/node_modules/playwright/index.mjs" node scripts/references-browser-check.js
      - name: Verify hosted server health and security headers
        run: node scripts/server-health-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-preview
          path: ${{ runner.temp }}/mlos-screenshots
          if-no-files-found: ignore
          retention-days: 7

  evidence-foundation-pglite:
    # Offline snapshot/schema tests only; do not connect to hosted databases.
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 349 || github.event.pull_request.number == 350) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated embedded PostgreSQL engine
        run: npm install --prefix "$RUNNER_TEMP/mlos-evidence-foundation" --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: Verify source-evidence SQL binding, conformance and snapshot recovery
        env:
          PGLITE_MODULE_URL: file://${{ runner.temp }}/mlos-evidence-foundation/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node scripts/source-evidence-db-check.js
          node scripts/source-evidence-sql-conformance.js
          node scripts/source-evidence-recovery-check.js

  internal-source-review-pglite:
    # Synthetic internal reviewer/SQL role acceptance ONLY; no hosted DB.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 354 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated embedded PostgreSQL
        run: npm install --prefix "$RUNNER_TEMP/mlos-internal-review" --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: Verify isolated immutable internal review decisions and role denial
        env:
          PGLITE_MODULE_URL: file://${{ runner.temp }}/mlos-internal-review/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/internal-source-review-sql-check.js

  internal-review-native-postgres:
    # Explicitly test both valid lock/commit orders. No hosted database.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 355 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pgmajor: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pgmajor }}
        env:
          POSTGRES_PASSWORD: synthetic-local-review-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated native PostgreSQL client
        run: npm install --prefix "$RUNNER_TEMP/mlos-internal-review-native" --no-audit --no-fund pg@8.14.1
      - name: Verify grant/decision transaction races and exact retry on PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic-local-review-only
          PGDATABASE: postgres
          EXPECTED_NATIVE_PG_MAJOR: ${{ matrix.pgmajor }}
          PG_MODULE_URL: file://${{ runner.temp }}/mlos-internal-review-native/node_modules/pg/lib/index.js
        run: node scripts/internal-source-review-native-races.js

  internal-review-bound-identity-native:
    # Synthetic dedicated PostgreSQL logins only; not hosted MLOS Auth.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 356 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pgmajor: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pgmajor }}
        env:
          POSTGRES_PASSWORD: synthetic-local-review-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/mlos-internal-identity" --no-audit --no-fund pg@8.14.1
      - name: Verify session-bound reviewer identity and append-only revocations
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: synthetic-local-review-only
          PGDATABASE: postgres
          EXPECTED_NATIVE_PG_MAJOR: ${{ matrix.pgmajor }}
          PG_MODULE_URL: file://${{ runner.temp }}/mlos-internal-identity/node_modules/pg/lib/index.js
        run: node scripts/internal-source-review-bound-identity-check.js

  internal-review-jwt-postgrest-native:
    # Official PostgREST verifies synthetic JWTs, with ephemeral PG17/18 only.
    # Not connected to hosted identity systems or production source evidence.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 359 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pgmajor: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.pgmajor }}
        env:
          POSTGRES_PASSWORD: synthetic-local-review-only
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      PGPASSWORD: synthetic-local-review-only
      REVIEW_TEST_JWT_SECRET: synthetic-local-only-review-jwt-secret-2026
      REVIEW_TEST_API: http://127.0.0.1:3030
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated SQL client
        run: npm install --prefix "$RUNNER_TEMP/mlos-postgrest-review" --no-audit --no-fund pg@8.14.1
      - name: Seed synthetic role, grant, session and package fixtures
        env:
          PG_MODULE_URL: file://${{ runner.temp }}/mlos-postgrest-review/node_modules/pg/lib/index.js
        run: REVIEW_SETUP_ONLY=1 node scripts/internal-source-review-postgrest-jwt-check.js
      - name: Start official verified-JWT PostgREST gateway
        run: |
          docker run -d --rm --name mlos-postgrest-review --network host \
            -e PGRST_SERVER_PORT=3030 \
            -e PGRST_DB_URI=postgres://authenticator:synthetic-only-authenticator@127.0.0.1:5432/postgres \
            -e PGRST_DB_SCHEMAS=evidence_api \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_AUD=mlos-source-review-fixture \
            -e PGRST_JWT_SECRET="$REVIEW_TEST_JWT_SECRET" \
            postgrest/postgrest:v14.18
      - name: Verify signed-JWT actor and current session/grant in database transaction
        env:
          PG_MODULE_URL: file://${{ runner.temp }}/mlos-postgrest-review/node_modules/pg/lib/index.js
        run: REVIEW_SKIP_SETUP=1 node scripts/internal-source-review-postgrest-jwt-check.js
      - name: Dispose gateway even if test fails
        if: always()
        run: docker rm -f mlos-postgrest-review || true

  internal-review-real-local-gotrue:
    # Disposable loopback Auth session + internal review commit, no hosted environment.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 360 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated pinned local Auth tools
        run: npm install --prefix "$RUNNER_TEMP/mlos-internal-gotrue" --no-audit --no-fund supabase@2.120.0 @supabase/supabase-js@2.118.0 pg@8.22.0
      - name: Start migration-free, loopback-only Auth stack
        run: |
          CLI="$RUNNER_TEMP/mlos-internal-gotrue/node_modules/.bin/supabase"
          mkdir -p "$RUNNER_TEMP/mlos-auth-review-stack"
          cd "$RUNNER_TEMP/mlos-auth-review-stack"
          "$CLI" init
          "$CLI" start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Test provider session lock against internal decision commit and sign-out
        run: |
          CLI="$RUNNER_TEMP/mlos-internal-gotrue/node_modules/.bin/supabase"
          cd "$RUNNER_TEMP/mlos-auth-review-stack"
          STATUS="$("$CLI" status -o env)"
          DB_URL="$(printf '%s\n' "$STATUS" | sed -nE 's/^DB_URL="?([^"]+)"?$/\1/p' | head -1)"
          KEY="$(printf '%s\n' "$STATUS" | sed -nE 's/^PUBLISHABLE_KEY="?([^"]+)"?$/\1/p' | head -1)"
          if [[ "$DB_URL" != postgresql://postgres:*@127.0.0.1:54322/postgres && "$DB_URL" != postgres://postgres:*@127.0.0.1:54322/postgres ]] || [[ "$KEY" != sb_publishable_* ]]; then
            echo "LOCAL_SOURCE_REVIEW_AUTH_NOT_ACCEPTED: exact disposable DB/Auth configuration missing"
            exit 1
          fi
          echo "export { createClient } from '@supabase/supabase-js';" > "$RUNNER_TEMP/mlos-internal-gotrue/review-sdk.mjs"
          export MLOS_LOCAL_REVIEW_CONFIRM=ISOLATED_LOCAL_GOTRUE_TEST_STACK
          export MLOS_LOCAL_REVIEW_URL=http://127.0.0.1:54321
          export MLOS_LOCAL_REVIEW_DB_URL="$DB_URL"
          export MLOS_LOCAL_REVIEW_KEY="$KEY"
          export MLOS_LOCAL_REVIEW_SDK="file://$RUNNER_TEMP/mlos-internal-gotrue/review-sdk.mjs"
          export MLOS_LOCAL_REVIEW_PG="file://$RUNNER_TEMP/mlos-internal-gotrue/node_modules/pg/esm/index.mjs"
          node "$GITHUB_WORKSPACE/scripts/internal-source-review-local-gotrue-check.mjs"
      - name: Destroy local Auth stack, identities and unbacked DB
        if: always()
        run: |
          CLI="$RUNNER_TEMP/mlos-internal-gotrue/node_modules/.bin/supabase"
          if [[ -x "$CLI" && -d "$RUNNER_TEMP/mlos-auth-review-stack/supabase" ]]; then
            cd "$RUNNER_TEMP/mlos-auth-review-stack"
            "$CLI" stop --no-backup
          fi

  internal-review-real-gotrue-jwt-atomic:
    # Test-only local Auth-issued JWT via PostgREST + real session row.
    # Never connect to a hosted project or migrate a real database.
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.number == 361 || github.event.pull_request.number == 362) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned isolated Auth SDK and database tools
        run: npm install --prefix "$RUNNER_TEMP/mlos-atomic-review" --no-audit --no-fund supabase@2.120.0 @supabase/supabase-js@2.118.0 pg@8.22.0
      - name: Start migration-free local identity and database services
        run: |
          CLI="$RUNNER_TEMP/mlos-atomic-review/node_modules/.bin/supabase"
          mkdir -p "$RUNNER_TEMP/mlos-atomic-stack"
          cd "$RUNNER_TEMP/mlos-atomic-stack"
          "$CLI" init
          "$CLI" start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Prove verified user JWT, active session, grant and immutable event within one transaction
        run: |
          CLI="$RUNNER_TEMP/mlos-atomic-review/node_modules/.bin/supabase"
          cd "$RUNNER_TEMP/mlos-atomic-stack"
          STATUS="$("$CLI" status -o env)"
          DB_URL="$(printf '%s\n' "$STATUS" | sed -nE 's/^DB_URL="?([^"]+)"?$/\1/p' | head -1)"
          KEY="$(printf '%s\n' "$STATUS" | sed -nE 's/^PUBLISHABLE_KEY="?([^"]+)"?$/\1/p' | head -1)"
          if [[ "$DB_URL" != postgresql://postgres:*@127.0.0.1:54322/postgres && "$DB_URL" != postgres://postgres:*@127.0.0.1:54322/postgres ]] || [[ "$KEY" != sb_publishable_* ]]; then
            echo "LOCAL_ATOMIC_REVIEW_AUTH_NOT_ACCEPTED: no disposable Auth or DB"
            exit 1
          fi
          echo "export { createClient } from '@supabase/supabase-js';" > "$RUNNER_TEMP/mlos-atomic-review/review-sdk.mjs"
          export MLOS_LOCAL_ATOMIC_CONFIRM=ISOLATED_LOCAL_GOTRUE_TEST_STACK
          export MLOS_LOCAL_ATOMIC_URL=http://127.0.0.1:54321
          export MLOS_LOCAL_ATOMIC_DB_URL="$DB_URL"
          export MLOS_LOCAL_ATOMIC_KEY="$KEY"
          export MLOS_LOCAL_ATOMIC_SDK="file://$RUNNER_TEMP/mlos-atomic-review/review-sdk.mjs"
          export MLOS_LOCAL_ATOMIC_PG="file://$RUNNER_TEMP/mlos-atomic-review/node_modules/pg/esm/index.mjs"
          node "$GITHUB_WORKSPACE/scripts/internal-source-review-real-gotrue-jwt-check.mjs"
      - name: Destroy synthetic Auth project and unbacked database
        if: always()
        run: |
          CLI="$RUNNER_TEMP/mlos-atomic-review/node_modules/.bin/supabase"
          if [[ -x "$CLI" && -d "$RUNNER_TEMP/mlos-atomic-stack/supabase" ]]; then
            cd "$RUNNER_TEMP/mlos-atomic-stack"
            "$CLI" stop --no-backup
          fi
