name: Redeploy V3 protected Supabase APIs

on:
  push:
    branches:
      - ops/redeploy-v3-protected-apis
    paths:
      - .github/workflows/redeploy-v3-protected-apis.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: iyapppmeieqhflnzslao
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require repository Supabase deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not configured" >&2
            exit 1
          fi
      - name: Deploy Study API from repository source
        run: supabase functions deploy study-api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy Review API from repository source
        run: supabase functions deploy review-api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verify unauthenticated requests remain rejected
        shell: bash
        run: |
          for fn in study-api review-api; do
            status=$(curl -sS -o /tmp/${fn}.json -w '%{http_code}' "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}/")
            test "$status" = "401"
          done
